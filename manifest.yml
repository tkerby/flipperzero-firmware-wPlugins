## Flipper Apps Catalog manifest for Ghost Tracker.
## This file is submitted to github.com/flipperdevices/flipper-application-catalog
## at applications/Tools/ghost_tracker/manifest.yml — it is NOT read by ufbt
## and does not need to be built into the app itself, but is kept here in the
## app's own repo for convenience/reference.

sourcecode:
  type: git
  location:
    origin: https://github.com/Zinetick/ghost_tracker.git
    commit_sha: REPLACE_WITH_LATEST_COMMIT_SHA
short_description: Paranormal investigation instrument - EMF meter, Spirit Box and REM Pod
description: |
  Ghost Tracker turns your Flipper Zero into a 3-in-1 paranormal investigation
  instrument, using **real hardware techniques** instead of fake/random readings:

  - **EMF Meter**: ambient RF noise via the built-in Sub-GHz radio (no wiring
    needed), or an optional external Hall sensor with mains-hum filtering for
    a more authentic K-II-style reading.
  - **Spirit Box**: a real Sub-GHz frequency sweep with genuine RF static
    played through the speaker - not a synthesized tone.
  - **REM Pod**: capacitive proximity detection using a simple copper wire
    antenna, the same principle as a real REM Pod.

  See the in-app About screen and the repository README for wiring diagrams
  and details on each module's optional external sensor.
changelog: "@CHANGELOG.md"
screenshots:
  - screenshots/ss0.png
  - screenshots/ss1.png
  - screenshots/ss2.png
  - screenshots/ss3.png
  - screenshots/ss4.png
