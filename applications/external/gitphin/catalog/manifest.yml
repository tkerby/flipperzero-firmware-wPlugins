# Flipper Apps Catalog manifest for Gitphin.
# Copy to applications/Tools/gitphin/manifest.yml in a fork of
# https://github.com/flipperdevices/flipper-application-catalog and open a pull request.
# Every GitHub release attaches this file with commit_sha already set to the release commit
# (catalog-manifest.yml); see catalog/README.md.
sourcecode:
  type: git
  location:
    origin: https://github.com/Adhamura/Gitphin.git
    commit_sha: COMMIT_SHA
    subdir: flipper_app
id: gitphin
description: "@README.md"
changelog: "@docs/changelog.md"
screenshots:
  - screenshots/ss0.png
  - screenshots/ss1.png
