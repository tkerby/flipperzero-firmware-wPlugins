# Tag ontology. Every tag an entity or a question may use must be declared here.
# The value is the list of tags it implies; build_dataset.py takes the transitive
# closure, so tagging "dog" as [mammal, pet] also gives it animal, alive, natural.
#
# Implications must be things that are ALWAYS true for the tag. Merely likely
# facts ("mammals usually have fur") belong in a question's `l:` list instead.

tags:
  # --- top level ---
  alive: []
  natural: []
  manmade: [inanimate]
  inanimate: []
  dead: [inanimate]
  concept: [inanimate, abstract]
  abstract: []
  place: []
  person: [alive, natural]

  # --- animals ---
  animal: [alive, natural]
  mammal: [animal, warm_blooded]
  bird: [animal, warm_blooded, has_feathers, has_wings, has_beak, two_legs, lays_eggs]
  fish: [animal, aquatic, swims, lays_eggs, has_scales, no_legs, cold_blooded]
  insect: [animal, six_legs, lays_eggs, small_animal, cold_blooded]
  arachnid: [animal, eight_legs, lays_eggs, small_animal, cold_blooded]
  reptile: [animal, has_scales, lays_eggs, cold_blooded]
  amphibian: [animal, lays_eggs, swims, cold_blooded]
  mollusc: [animal, no_legs, cold_blooded]
  crustacean: [animal, aquatic, has_shell, many_legs, cold_blooded]
  rodent: [mammal, small_animal, has_fur, has_tail, four_legs]
