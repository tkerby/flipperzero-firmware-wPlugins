# Memory budget of Nucleo (contract section 5.x "Memory budget (enforced)"). Read by tools/mem_budget.py.
# All numbers are bytes; "KB" in the contract and in the Flipper overlay is 1000 bytes (resident 46,887 B = 46.9 KB).
#
# Rules (the script prints the same ones on a failure):
#  * a module's `ratchet` is the largest size it may have; it only ever goes DOWN by itself (`mem_budget.py --update`),
#    going up needs `mem_budget.py --raise <module> <bytes> --reason "..."`, which is logged at the end of this file.
#  * `target` is the approved budget: above it is a WARN while the module is within its ratchet, never a FAIL.
#  * a heap `mode` is predicted by tools/mem_budget.py (model in the contract); below `floor` is a FAIL unless
#    `known_red = true`, and then it only fails when the prediction drops more than `tol` below `baseline`
#    (the recorded value; `--update` raises it when the prediction improves and clears known_red once the floor is met).

# TWO BUILDS (2026-10-13, contract 5.x): everything below (ratchets, targets, baselines, known_red) is the RELEASE build, the default `ufbt build` without NUCLEO_DEBUG,
# which is what the player runs. The DEV build (`NUCLEO_DEBUG=1 ufbt build`: debug overlay, +1.7 KB resident) is only checked against the same heap `floor`s
# (FAIL under a floor; no ratchet, no baseline, known_red ignored): tools/mem_budget.sh builds both. The calibration offsets below were fitted on DEV builds on the
# device (image 46,887); the model just uses the release image, so they are carried over until a release device reading re-fits them (`--calibrate explore`).

[meta]
tol = 256                  # slack in bytes: ratchet = measured + tol when set; known-red regression tolerance

[system]
free_heap = 146500         # device, no app open (lead, 2026-10-12)
host_cache_bytes = 2679    # hero facing (1,575) + draw list and pin layer (864 + 240, ONE block since contract 70): hw_main's `J` token excludes them, the next world frame allocates them again (the streamed NPC frames are left out of the peaks and of explore_live separately: contract 5.x, task L)
loader_stays = 1500        # ELFFile + section map + FlipperApplication: stay in the heap while a plugin is loaded (contract 5, MEM3)
real_maps_below = 200      # map ids >= 200 are test maps (maps/maps.txt); only the real ones count for "the biggest map"
extra_real_maps = [229, 230]   # D1 (contract 68): the Ruinas del Origen and the Gruta del Eclipse live in the reserved range 229 .. 239 (above the test fixtures' base): they count as real maps
route1_map = 3             # the calibration map (Ruta 1)
shop_map = 6               # the map whose clerk opens the shop (tienda)

