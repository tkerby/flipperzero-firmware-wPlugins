# Nucleo species ("Elementis"). Species id = position in this file (1-based; 0 = none).
# Name text key = gl.sp.<id>. Base stats [hp, atk, def, spd, spc] (one Special stat).
# growth: medium_fast | medium_slow | fast | slow. evolve = [level, "species"].
# evolve_stone = { thunder = "voltgecko" } (optional, C4-B, contract 36): evolves when that stone is used on it from the bag (never by level; exclusive with `evolve`).
#        Keys: moon | fire | water | thunder | leaf (the Spanish item keys luna / fuego / agua / trueno / hoja are accepted too). SEVERAL stones may be listed
#        (the role: { water = "tidebara", fire = "embara", thunder = "voltbara" }), one target per stone. Compiled by tools/regc.py into files/evostone.bin.
# evolve_trade = "species" (optional, IR LINK, contract 45): evolves right after a TRADE over the infrared link; exclusive with `evolve` and
#        `evolve_stone`. Compiled by tools/regc.py into files/evostone.bin (a record whose stone index is 5, ST_TRADE). C6 wired the first one: Trancelf -> Somnarch (-> a creature); the IR link made Tuskmash -> Tuskumo (a creature -> a creature); contract 74 (F2) wires the last two ones: Rockroll -> Bouldrum (a creature -> a creature) and Shroudle -> Gloomshroud (a creature -> a creature).
# evolve_friend = [level, "species"] (optional, contract 65): evolves at a LEVEL-UP at that level or later when its friendship is 220 or more (happiness evolutions); the level is the old plain
#        threshold, kept as the floor. Exclusive with `evolve`, `evolve_stone` and `evolve_trade`. reg.bin keeps the level + target (evo_level / evo_to) and evostone.bin gets one record {species, ST_FRIEND, target}.
#        Used by hatchkip -> shellbrute and dashkip -> dashmark. Friendship: nucleo/battle_core.h bc_friend, contract section 65.
# learn = [[level, "move"], ...] (level 1 entries are the starting moves; <= 12 entries).
# tm = ["disc_01", ...] (optional, C2-S1): the technique discs (items.toml kind = "disc") this species can learn; regc packs them into a 24-bit mask.
# When a creature is created at level L it gets the last 4 moves with level <= L (oldest replaced first).
#
# art = "<folder>" (optional): picture folder under assets/art/elementis/ with the PixelLab 8-direction PNGs; tools/monc.py
# builds nucleo/files/mon.bin from south-west.png (front) and north-east.png (back). Swapping final art = changing the folder.
# art_dark_cut = N (optional, default 70): luminance at or below which a pixel of the picture becomes black in the 4-gray
# mapping (tools/monc.py). A very dark creature needs a lower value (muncrit 45) or it turns into a black blob. regc ignores it.
#
# height (metres) / weight (kilograms), both required for the Registro (contract 30, tools/regc.py -> files/reginfo.bin, 0.1 resolution). The Registro
# description is the global text key gl.rg.<species id> in the four text files (2 pages of <= 2 lines; block "# --- C2-S2 Registro ---").
# reg = N (optional): sort key of the Registro list (default = the species id; the number shown is the rank 1..N, ties by id).
#
# Balance reference: starters sum to 249-254 (one Special) at stage 1 and 325 at stage 2.

