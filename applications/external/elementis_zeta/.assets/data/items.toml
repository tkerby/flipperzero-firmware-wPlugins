# Nucleo items. Item id = position in this file (1-based; 0 = none). Name text key = gl.it.<id> (global).
# Compiled by tools/regc.py into nucleo/files/items.bin (format: contract 14.1) and the IT_* defines of
# nucleo/gen/reg_gen.h.
#
# kind = "catch": a capsule that captures a wild creature. ball = "crystal" (the ball
#        numbers: random range 0..255, HP divisor 12) | "great" (0..200, divisor 8) | "ultra" (0..150, divisor 12) |
#        "master" (always catches).
# kind = "heal": restores `hp` points to one party member (hp = 255: full), not to a fainted one and not above max HP.
# kind = "cure": cures one status of one party member (M4-A; Antidote / Limb Balm / Wake Salts / Cool Gel / Defrost).
#        status = "psn" | "par" | "slp" | "brn" | "frz". Usable (in battle and in the bag screen) only on a living creature that
#        has exactly that status; otherwise "no effect" and nothing is consumed. In battle it uses the turn.
# kind = "repel" (C2-S1): used from the bag outside battle. `steps` = how many steps (1..255) no wild creature whose level is below the
#        party's first non-fainted creature's level can appear. Stored in PartyState.reserved[0] (saved with the game).
# kind = "rope" (C2-S1): Exit Wisp. Usable only in a cave map (mapc `@cave yes`, header flag MAPF_CAVE): warps to the last Centro.
# kind = "disc" (C2-S1): a technique disc (single use). `move` = the move it teaches (moves.toml key). The disc's number (0..23, by
#        its order among the disc items) is the bit that species.toml `tm = ["disc_01", ...]` sets for the species that can learn it
#        (reg.bin species record: the u16 at byte 12 = bits 0..15, the byte at 15 = bits 16..23).
# kind = "key": a key item. Listed in the bag, never usable, never tossed, never sold: no price. Exceptions (C4-B): `bici` is "used" from the
#        bag (Usar = world_bike_toggle(), contract 35 / 36); the others have no use yet (`flauta` C5) or are read by the code (`lente`: the battle plugin,
#        `cupon_bici`: the bike shop's script).
# kind = "stone" (C4-B, contract 36): an evolution stone. `stone` = "moon" | "fire" | "water" | "thunder" | "leaf" (the index goes in items.bin arg; ST_* in reg_gen.h).
#        Used from the bag on a party member: if its species lists that stone in species.toml `evolve_stone`, the stone is consumed and the evolution scene runs
#        (it cannot be cancelled); otherwise "no effect" and nothing is consumed.
# kind = "vitamin" (C4-B): +2560 stat EXP to ONE stat of one party member. `stat` = "hp" | "atk" | "def" | "spd" | "spc".
# price = shop price (M4-B). ball 200, Salve 300, Antidote 100, Limb Balm 200, Wake Salts 250, Cool Gel 250.
# The ids are POSITIONS (saves store them): append new items at the END, never reorder.

[crystal]
kind = "catch"
ball = "crystal"
price = 200

[salve]
kind = "heal"
hp = 20
price = 300

[antidote]
kind = "cure"
status = "psn"
price = 100

[limb_balm]
kind = "cure"
status = "par"
price = 200

[wake_salts]
kind = "cure"
status = "slp"
price = 250

[cool_gel]
kind = "cure"
status = "brn"
price = 250

[parcel]
kind = "key"

