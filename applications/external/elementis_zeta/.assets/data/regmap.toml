# The region map (the Atlas, contract 74): the layout of the schematic picture tools/regmapc.py renders into nucleo/files/regmap.bin (128 x 64, the level buffer's packing; the bottom 13 rows are the name bar).
# `[place.<area key>]`: where the mark of that zone banner (mapc AREA_KEYS) sits (the centre, in picture pixels) and what is drawn there. Every map belongs to the area of its own @area, or, an interior with none (or with
# an area that is not placed), to the nearest placed area through the warps (a house = its town); `[alias]` names a map the warps cannot reach.
# kind: town (a 5 x 5 square, 7 x 7 for a city) | route (nothing drawn, the road passes) | cave (a dark mound) | wood (three trees) | plateau (the League: a flag on a mount) | ruin | power | reserva (a hatched field) | island | sea (nothing drawn, the dotted sea road passes)
# [[road]]: pts = a polyline of the road (a straight run between points, drawn in black); style = road | sea (dotted).

