# ======================================================================================================================
# Contract 64: the missing moves, ids 98 .. 163 (positions).
# New engine effects (battle plugin only; arg0 / arg1 are the generic move-record bytes, EF_* in reg_gen.h):
#   multi arg0 = hits (0 = 2 .. 5: 37.5 / 37.5 / 12.5 / 12.5 %); power per hit, one accuracy check, one damage roll
#   fixed arg0 = damage (0 = the user's level, 255 = half the target's current HP, 254 = Mind Wave: random 1 .. 1.5 x the level, contract 82); power must be non-zero (the damage path runs: type immunity, then the fixed number)
#   coin_hit     contract 82: a plain damaging move; every hit scatters 2 x the user's level in coins (EV_MSG 26), paid to the player at the end of a battle won or caught
#   ohko one-hit KO: misses when the user is slower than the target; the accuracy is the 30 % of the table
#   recoil arg0 = divisor: the user loses damage / arg0 (min 1) after a hit (Rush / Reckless / Submission: 4)
#   drain arg0 = divisor: the user heals damage / arg0 (min 1); arg1 = 1: only against a sleeping target (Dream Feast)
#   heal arg0 = 0: half the maximum HP (Recover / Hearty Broth), arg0 = 1: Rest (full HP, cures, sleeps 2 turns)
#   suicide the user faints after the move (Blow Up / Explosion; the target's Defense counts half)
#   charge     two turns: the first only charges, the second hits; arg0 bit 0 = invulnerable meanwhile (Fly); arg1 = the EV_MSG index of the charging line
#   lock arg0 = 0: Rampage / Petal Waltz (2 .. 3 turns, then the user is confused); arg0 = 1: Bind / Wrap / Clamp / Cinder Spin (2 .. 5 turns, the target cannot act)
#   flee       Teleport / Roar / Whirlwind: a wild battle ends; fails against a trainer
#   stat_reset, mist, leech (Sap Seed), counter (twice the last Normal / Fighting damage taken this turn), store_dmg (2 .. 3 turns, then twice the damage taken),
#   substitute (a quarter of the max HP becomes a decoy that takes the hits), move_call (arg0 = 0: a random move, 1: the target's last move)
# ======================================================================================================================
