# Nucleo moves. Name text key = gl.mv.<id>. Move id = position in this file (1-based; 0 = none).
#
# type      type id from types.toml
# power     0 = status move
# acc       percent 1..100 (stored 0..255: pct*255/100, so 100 -> 255)
# pp        base PP
# effect    none | stat_tgt | stat_self | status_tgt | focus | screen
#             stat_tgt/stat_self: stat = atk|def|spd|spc|acc|eva, stages = signed delta
#             status_tgt: status = sleep|poison|burn|freeze|paralysis|confusion
#             screen: screen = reflect|light_screen
#             flinch (secondary effect on the target): effect = "flinch"
# chance    percent for the effect (omit = always; secondary effects of damaging moves use e.g. 10)
# priority  -6..+6 (default 0)
# high_crit / never_miss  booleans
# Contract 64 effects (multi fixed ohko recoil drain heal suicide charge lock flee stat_reset mist leech counter store_dmg substitute move_call): `arg0` / `arg1` bytes, documented at the block that
# starts with "Contract 64" below.

