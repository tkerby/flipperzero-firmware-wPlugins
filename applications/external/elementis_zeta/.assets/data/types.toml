# Nucleo type table + effectiveness chart (15 types).
# Type id = index in this list (0..14). Physical/special is decided by the TYPE:
# the first 8 types are physical, the last 7 special. Name text key = gl.ty.<id>.
[[type]]
id = "normal"
physical = true
[[type]]
id = "fighting"
physical = true
[[type]]
id = "flying"
physical = true
[[type]]
id = "poison"
physical = true
[[type]]
id = "ground"
physical = true
[[type]]
id = "rock"
physical = true
[[type]]
id = "bug"
physical = true
[[type]]
id = "ghost"
physical = true
[[type]]
id = "fire"
physical = false
[[type]]
id = "water"
physical = false
[[type]]
id = "grass"
physical = false
[[type]]
id = "electric"
physical = false
[[type]]
id = "psychic"
physical = false
[[type]]
id = "ice"
physical = false
[[type]]
id = "dragon"
physical = false

# Effectiveness rows [attacking type, defending type, multiplier in tenths: 20 / 5 / 0].
# ORDER MATTERS: a move walks the rows top to bottom and, for each
# row whose attacker matches, applies it once if the row's defender equals either defender type;
# damage is truncated after every row, so dual types give the same numbers as.
# Pairs not listed are 1x (so ice -> fire is 1x).
# FIX: ghost -> psychic is 2x here (had 0x by mistake); the row keeps its original position.
[chart]
rows = [
  ["water", "fire", 20],
  ["fire", "grass", 20],
