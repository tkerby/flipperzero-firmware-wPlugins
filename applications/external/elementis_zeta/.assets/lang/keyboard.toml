# Naming keyboard (task K, contract 11.6). Read by tools/mkfont.py: it adds every key to the language's font charset and writes
# nucleo/files/lang/<dir>/kb.bin (the grid pages as font codes + a code <-> Unicode table of the non-ASCII characters).
#
#  - `rows` x `cols` is the grid; every page is `rows` strings of exactly `cols` characters (one character per cell).
#    "¤" (U+00A4) = an empty cell (the cursor skips it); "␣" (U+2423) = the space key.
#  - `cmd` = "bottom": the command row (page switch, end) is the last row under the grid, with the prompt and the name
#    slots on the first line; "top": the commands share the first line with the name slots (no room for a row).
#  - `max_name` / `max_nick`: longest player / rival name and creature nickname, in characters. mkfont checks that the
#    widest key times the limit fits the lint's name token (`name_px`) and `var_px[0]` of langs.toml, so no text, plate or
#    list ever overflows.
#  - `hidden`: characters that are not keys but are always in the table / font, so a name typed in another language
#    survives a language switch (es <-> en lose nothing).
#  - the characters of the suggested names (gl.name.p* / r*) are added to the table automatically.
#  - Names are stored as Unicode (PartyState v3); only the non-ASCII part of the table is needed to convert them to the
#    codes of the language in use.

[es]
cols = 10
rows = 4
cmd = "bottom"
max_name = 7
max_nick = 10
hidden = ""
[[es.page]]
rows = ["ABCDEFGHIJ",
        "KLMNÑOPQRS",
        "TUVWXYZÁÉÍ",
        "ÓÚÜ␣.-'!?,"]
[[es.page]]
rows = ["abcdefghij",
        "klmnñopqrs",
        "tuvwxyzáéí",
        "óúü␣.-'!?,"]
[[es.page]]
rows = ["0123456789",
        ".,-'!?:;/&",
        "()+*#@%=¿¡",
        "␣¤¤¤¤¤¤¤¤¤"]

[en]
cols = 10
rows = 4
cmd = "bottom"
max_name = 7
max_nick = 10
hidden = "ÁÉÍÓÚÜÑáéíóúüñ¿¡"
[[en.page]]
rows = ["ABCDEFGHIJ",
        "KLMNOPQRST",
        "UVWXYZ␣.-'",
        "!?,/:&()+#"]
[[en.page]]
rows = ["abcdefghij",
        "klmnopqrst",
        "uvwxyz␣.-'",
        "!?,/:&()+#"]
[[en.page]]
rows = ["0123456789",
        ".,-'!?:;/&",
        "()+*#@%=␣¤",
        "¤¤¤¤¤¤¤¤¤¤"]

# Japanese: the gojuon table with the consonant lines as columns (a ka sa ta na ha ma ya ra wa) and the vowels as rows, like
# page 2 / 4 = the voiced (dakuten / handakuten) forms, the small kana, digits and a few marks. Page labels are the
# first kana of the page they lead to.
[ja]
cols = 10
rows = 5
cmd = "top"
max_name = 5
max_nick = 6
hidden = ""
[[ja.page]]
rows = ["あかさたなはまやらわ",
