# Sprite catalog (contract section 6). Read by tools/mapc.py and tools/spritec.py.
#
# sprite = [ {...} ]   one PHYSICAL sprite per entry
#   name        unique id
#   kind        "tile" | "object" | "actor"
#   src         tile/object: path of the .lv.png (sibling .json has w,h,ax,ay)
#               actor: folder with the PixelLab direction PNGs
#   fw, fh      footprint in tiles (i by j). Tiles are 1x1.
#   cflags      subset of solid grass water counter warp trigger ledge
#               (tile = default flags of the tile; object = flags of each footprint cell)
#   door_tiles  object-relative [i,j] cells of the footprint that are walkable doors
#   ndirs, nframes   actors only (8 dirs, 1 frame for now)
#   fill        tile: level 0..3 for the diamond under the art (omit = none)
#               object: ground contact shadow drawn by render.c (omit = none): 1/2 = band of that level along
#               the two front edges (also the floor AO next to walls), 3 = blob under a 1x1 object (trees, rocks)
#   text        default text key for interactions on this sprite
#
# [alias]   LOGICAL name -> actual sprite (or list of sprites). Map files only ever use
#           logical names, so swapping art never touches a .map file:
#             house_player = "fb_house"        # fallback now
#             # house_player = "house_player"  # real art later (or just delete the line)
#           A list value ["a","b","c"] tiles a multi-cell logical object out of 1x1 sprites,
#           row-major (j then i). Its length must equal fw*fh of the logical entry.
# [variants]  group name -> list of tiles, picked per cell by hash(i,j); repeat to weight.
#
# Face convention: "_i" = the face whose normal is +i (screen down-right: left-wall column at
# i=0, right fence column); "_j" = normal +j (screen down-left: back-wall row j=0, front fence row).
# (TOML: top-level `sprite` comes first, the [alias] / [variants] tables after it.)

