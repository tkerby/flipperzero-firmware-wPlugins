name: Build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly check against the latest SDKs
    - cron: "17 3 * * 1"

jobs:
  test:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run with sanitizers
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            yt_parse.c tests/test_yt_parse.c -o /tmp/test_yt_parse
          /tmp/test_yt_parse
      - name: Wi-Fi transport against a simulated FlipperHTTP board
        run: tests/wifi_sim/run.sh

  build:
    name: "ufbt: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release channel
            sdk-channel: release
          - name: dev channel
            sdk-channel: dev
    steps:
      - uses: actions/checkout@v4
      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}
