name: Build and prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build updater package
        run: ./fbt TARGET_HW=7 DEBUG=0 COMPACT=1 fap_dist updater_package

      - name: Package updater
        id: package
        run: |
          set -euo pipefail
          UPDATE_DIR="$(find dist -type d -name 'f7-update*' -print -quit)"
          test -n "$UPDATE_DIR"
          ARCHIVE="dist/${GITHUB_SHA}.zip"
          (cd "$UPDATE_DIR" && zip -r "../../${ARCHIVE}" .)
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Upload updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}
          path: ${{ steps.package.outputs.archive }}

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          files: ${{ steps.package.outputs.archive }}
