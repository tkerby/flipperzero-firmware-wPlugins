name: Build and prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-prerelease
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FBT_GIT_SUBMODULE_SHALLOW: 1

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Build updater package
        run: ./fbt TARGET_HW=7 DEBUG=0 COMPACT=1 fap_dist updater_package

      - name: Package updater
        id: package
        shell: bash
        run: |
          set -euo pipefail
          UPDATE_DIR="$(find dist -type d -name 'f7-update*' -print -quit)"
          test -n "$UPDATE_DIR"
          ARCHIVE="$GITHUB_WORKSPACE/dist/$GITHUB_SHA.zip"
          (cd "$UPDATE_DIR" && zip -qr "$ARCHIVE" .)
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload updater artifact
        uses: actions/upload-artifact@v7
        with:
          name: flipper-updater-${{ github.sha }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          files: ${{ steps.package.outputs.archive }}
