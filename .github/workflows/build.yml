name: Build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

jobs:
  test:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Music helpers (FMF output, note mapping)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            tests/test_music.c composer_music.c composer_model.c composer_weights.c -lm -o /tmp/test_music
          /tmp/test_music
      - name: C inference matches the Python reference
        run: python tests/parity.py

  build:
    name: "ufbt: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release channel
            sdk-channel: release
          - name: dev channel
            sdk-channel: dev
    steps:
      - uses: actions/checkout@v4
      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}
