# Tag-triggered release: two Official-SDK .fap files, named by firmware.
#
# The loader compares API major only (V-074; the minor check is still commented
# out in Official 1.5.1). One file cannot cover major 87 and major 88.
#
# sigroam-<version>.fap
#   Official release channel. On 2026-10-21 that was SDK 1.5.1 / API 88.2.
#   File for current Official, and for Unleashed / RogueMaster while their API
#   major matches. This is the build the Apps Catalog requires (C4).
#
# sigroam-<version>-momentum.fap
#   Official SDK 1.4.3, pinned by URL, API 87.1. File for Momentum (mntm-012)
#   and for Official 1.4.3. Built with the Official SDK, not the Momentum SDK:
#   Momentum's fbt appends a flags byte and makes .fapmeta 86 bytes, and the
#   Official loader reads past an 85-byte manifest (V-076). The job fails if
#   this pinned SDK is no longer API 87.
#
# Drop the Momentum file once Momentum's stable API major matches the current
# Official release. fap-build.yml still compiles Official, Momentum, and
# Unleashed on every push so a firmware-specific API fails there (C4). This
# workflow does not upload those Momentum-SDK or Unleashed-SDK binaries.
#
# Why this is a third workflow rather than a job inside fap-build.yml:
# fap-build runs on every push and pull request and must stay read-only
# (`permissions: contents: read`). Publishing a release needs `contents: write`,
# and widening the permission on the workflow that runs on every PR would hand
# write access to any pull request build. Splitting keeps the write scope on the
# one workflow that only ever runs from a tag on this repository.
#
# Why `gh release create` and not a third-party release action:
# the GitHub CLI is preinstalled on the runner image (GitHub CLI 2.98.0 on
# ubuntu-24.04, which is what ubuntu-latest currently resolves to -- see
# actions/runner-images images/ubuntu/Ubuntu2404-Readme.md). Using it removes a
# third-party dependency from the release path entirely, which matters more here
# than in the build workflows: this is the job that produces the artifact users
# actually install on their device.
#
# Why the tag is checked against application.fam:
# the Flipper Apps Catalog reads the version from `fap_version`, while users read
# it from the release tag. If the two disagree, the catalog and the download page
# advertise different versions of the same build and there is no way to tell from
# the .fap which one is right. The guard makes that mismatch a failed release
# instead of a silent inconsistency.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Guard first, in its own job: a version mismatch should fail before an SDK
  # download and a build have been spent on it.
  check:
    name: check tag vs fap_version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag and compare with application.fam
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag='${{ inputs.tag }}'
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"

          # Single-quoted class so the shell does not touch the quotes the grep needs.
          fam=$(grep -oE 'fap_version="[^"]+"' application.fam | head -1 | cut -d'"' -f2)
          if [ -z "$fam" ]; then
            echo "::error::could not read fap_version from application.fam"
            exit 1
          fi
          if [ "$version" != "$fam" ]; then
            echo "::error::tag $tag implies version $version but application.fam has fap_version=\"$fam\""
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag $tag matches fap_version=\"$fam\"" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (official SDK)
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}

      # Same pinned sha as fap-build.yml (v0.1.4). A sha rather than a floating
      # tag: tags can be repointed, and a release build should not depend on
      # upstream leaving a tag alone.
      #
      # No sdk-index-url = the official default
      # https://update.flipperzero.one/firmware/directory.json.
      - name: Build FAP
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@e7cd34914e61ddc056acd8daaab96d8b4d4d9f55 # v0.1.4
        with:
          sdk-channel: release
          sdk-hw-target: f7

      # fbt always names the output after the appid, so rename it to the name the
      # release advertises before it becomes an artifact.
      - name: Stage the .fap under its release name
        run: |
          set -euo pipefail
          mkdir -p staged
          fap=$(find ${{ steps.build.outputs.fap-artifacts }} -name '*.fap' -type f | head -1)
          if [ -z "$fap" ]; then
            echo "::error::no .fap produced"
            exit 1
          fi
          cp "$fap" "staged/sigroam-${{ needs.check.outputs.version }}.fap"
          ls -l staged/

      # The API major decides which firmwares can load this file (V-074), so it
      # belongs in the run summary next to the SDK it was built against.
      - name: Record SDK / API version
        run: |
          {
            echo "### official SDK"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| SDK version | \`${{ fromJSON(steps.build.outputs.ufbt-status).version }}\` |"
            echo "| API version | \`${{ steps.build.outputs.api-version }}\` |"
            echo "| hw target | \`${{ fromJSON(steps.build.outputs.ufbt-status).target }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staged FAP
        uses: actions/upload-artifact@v7
        with:
          name: release-official
          path: staged/*.fap
          if-no-files-found: error

  build_momentum:
    name: build (official SDK 1.4.3)
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}

      # Pinned zip, not the release channel. Momentum stable is still API 87
      # (mntm-012) after Official moved to API 88. sdk-url matches `ufbt update -u`.
      - name: Build FAP
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@e7cd34914e61ddc056acd8daaab96d8b4d4d9f55 # v0.1.4
        with:
          sdk-url: https://update.flipperzero.one/builds/firmware/1.4.3/flipper-z-f7-sdk-1.4.3.zip
          sdk-hw-target: f7

      - name: Require API 87
        run: |
          set -euo pipefail
          api="${{ steps.build.outputs.api-version }}"
          case "$api" in
            87.*) ;;
            *)
              echo "::error::pinned Official 1.4.3 SDK produced API $api, expected 87.*"
              exit 1
              ;;
          esac

      - name: Stage the .fap under its release name
        run: |
          set -euo pipefail
          mkdir -p staged
          fap=$(find ${{ steps.build.outputs.fap-artifacts }} -name '*.fap' -type f | head -1)
          if [ -z "$fap" ]; then
            echo "::error::no .fap produced"
            exit 1
          fi
          cp "$fap" "staged/sigroam-${{ needs.check.outputs.version }}-momentum.fap"
          ls -l staged/

      - name: Record SDK / API version
        run: |
          {
            echo "### official SDK 1.4.3 (Momentum file)"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| SDK version | \`${{ fromJSON(steps.build.outputs.ufbt-status).version }}\` |"
            echo "| API version | \`${{ steps.build.outputs.api-version }}\` |"
            echo "| hw target | \`${{ fromJSON(steps.build.outputs.ufbt-status).target }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staged FAP
        uses: actions/upload-artifact@v7
        with:
          name: release-momentum
          path: staged/*.fap
          if-no-files-found: error

  publish:
    name: publish release
    needs: [check, build, build_momentum]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Download built FAPs
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # Both files must exist and differ. An empty upload would still publish a
      # release, and the failure would only surface on a user's device.
      - name: Verify the artifacts are present
        run: |
          set -euo pipefail
          ls -l dist/
          off="dist/sigroam-${{ needs.check.outputs.version }}.fap"
          mom="dist/sigroam-${{ needs.check.outputs.version }}-momentum.fap"
          if [ ! -s "$off" ] || [ ! -s "$mom" ]; then
            echo "::error::missing or empty release fap"
            exit 1
          fi
          if cmp -s "$off" "$mom"; then
            echo "::error::official and momentum faps are identical"
            exit 1
          fi

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          off="dist/sigroam-$VERSION.fap"
          mom="dist/sigroam-$VERSION-momentum.fap"
          off_sha=$(sha256sum "$off" | awk '{print $1}')
          mom_sha=$(sha256sum "$mom" | awk '{print $1}')
          off_n=$(wc -c < "$off" | tr -d ' ')
          mom_n=$(wc -c < "$mom" | tr -d ' ')
          notes=$(mktemp)
          {
            echo "SigRoam $VERSION for the Flipper Zero."
            echo ""
            echo "Pick the file that matches the firmware on your Flipper. Copy it to \`SD Card/apps/GPIO/\`."
            echo ""
            echo "- **Momentum**, and Official 1.4.3: \`sigroam-$VERSION-momentum.fap\`"
            echo "  SHA-256 \`$mom_sha\`, $mom_n bytes."
            echo "- **Official, Unleashed, RogueMaster:** \`sigroam-$VERSION.fap\`"
            echo "  SHA-256 \`$off_sha\`, $off_n bytes."
            echo ""
            echo "If the Flipper says the app does not match its firmware, use the other file."
            echo ""
            echo "Scout Lite board tools, start recovery, and the upload status line need [Scout Lite Firmware v1.0.0](https://github.com/pingequalab/ESP32Marauder/releases/tag/scout-lite-v1.0.0) or later. The 2.4 GHz and 5 GHz counts, and a split size kept after reboot, need [v1.1.0](https://github.com/pingequalab/ESP32Marauder/releases/tag/scout-lite-v1.1.0). Other Marauder builds keep the generic pages."
            echo ""
            if [ -f CHANGELOG.md ]; then
              echo "See [CHANGELOG.md](CHANGELOG.md) for the full change list."
            fi
          } > "$notes"

          # Re-running a tag should refresh the assets rather than fail outright.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.fap --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" dist/*.fap \
              --title "SigRoam $VERSION" \
              --notes-file "$notes"
          fi
          gh release view "$TAG" --json tagName,isDraft,assets \
            --jq '"published " + .tagName + " draft=" + (.isDraft|tostring) + " assets=" + ([.assets[].name]|join(", "))'
