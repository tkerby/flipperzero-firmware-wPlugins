name: Release

# Publishes the GitHub Release v<version> automatically:
#   gitphin.fap                          the app for the official release firmware
#   gitphin-<version>-dev-firmware.zip   the app for the dev firmware (apps/Tools/gitphin.fap)
#   gitphin-<version>-pc.tar.gz          the PC bridge, git helper, systemd units, install.sh
#   catalog-manifest.yml                 Flipper Apps Catalog manifest for this commit
#   SHA256SUMS
# Every push to main whose fap_version in flipper_app/application.fam has no release yet is
# built and published (it creates the tag). To release: bump fap_version, add a "## <version>"
# section to CHANGELOG.md and a "v<version>:" entry to flipper_app/docs/changelog.md, merge.
# Pushing a tag v<version> (it must match) or "Run workflow" also work.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: New version?
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(sed -n 's/^ *fap_version="\([0-9.]*\)".*/\1/p' flipper_app/application.fam)
          tag="v$v"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          grep -q "^## $v\$" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $v' section"; exit 1; }
          grep -q "^v$v:\$" flipper_app/docs/changelog.md || { echo "::error::flipper_app/docs/changelog.md has no 'v$v:' entry"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
              [ "$tag" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME != fap_version $v"; exit 1; }
              echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::notice::$tag is already released. Bump fap_version in flipper_app/application.fam to publish a new release."
              echo "release=false" >> "$GITHUB_OUTPUT"
          else
              echo "::notice::Publishing $tag"
              echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  app:
    name: "App (${{ matrix.sdk }} firmware)"
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [release, dev]
    steps:
      - uses: actions/checkout@v4
      - name: Gzip the web page
        run: pc/tools/build_page.sh
      - name: Build with uFBT
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build
        with:
          app-dir: flipper_app
          sdk-channel: ${{ matrix.sdk }}
      - name: Collect
        run: |
          mkdir -p out/apps/Tools
          cp "$(find flipper_app/dist -name gitphin.fap | head -1)" out/apps/Tools/gitphin.fap
          echo "${{ steps.build.outputs.api-version }}" > out/api-version.txt
          echo "${{ steps.build.outputs.suffix }}" > out/suffix.txt
      - uses: actions/upload-artifact@v4
        with: { name: "app-${{ matrix.sdk }}", path: out, if-no-files-found: error }

  publish:
    name: Publish the release
    needs: [check, app]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
      V: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Files
        run: |
          mkdir dist
          cp art/app-release/apps/Tools/gitphin.fap dist/gitphin.fap
          API_REL=$(cat art/app-release/api-version.txt); API_DEV=$(cat art/app-dev/api-version.txt)
          echo "API_REL=$API_REL" >> "$GITHUB_ENV"; echo "API_DEV=$API_DEV" >> "$GITHUB_ENV"
          (cd art/app-dev && printf 'Gitphin %s for the Flipper Zero dev firmware (API %s).\nCopy apps/Tools/gitphin.fap to the same path on the SD card.\n' "$V" "$API_DEV" > README.txt && zip -qr "$GITHUB_WORKSPACE/dist/gitphin-$V-dev-firmware.zip" apps README.txt)
          git archive --format=tar.gz --prefix="gitphin-$V-pc/" -o "dist/gitphin-$V-pc.tar.gz" HEAD \
              pc systemd install.sh LICENSE README.md CHANGELOG.md SECURITY.md docs/api.md docs/git-design.md \
              ':(exclude)pc/tests'
          sed "s/COMMIT_SHA/$GITHUB_SHA/" catalog/manifest.yml > dist/catalog-manifest.yml
          cd dist && sha256sum ./* | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$V" '$0 == "## "v { on=1; next } /^## / { on=0 } on' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ### Install

          **Flipper:** copy **gitphin.fap** to \`/ext/apps/Tools/gitphin.fap\` on the SD card (qFlipper or
          Flipper Lab file manager). Built for the official **release** firmware (API $API_REL); for the
          **dev** firmware (API $API_DEV) use \`gitphin-$V-dev-firmware.zip\`. Other firmware: build from source.

          **PC (Linux):**
          \`\`\`bash
          tar xzf gitphin-$V-pc.tar.gz && cd gitphin-$V-pc
          ./install.sh        # bridge as a systemd user unit + git helper, no sudo
          \`\`\`
          Then plug in the Flipper and open http://localhost:8080. See the README for the one-time udev rule.

          Check downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`.
          NOTES
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Gitphin ${{ env.TAG }}
          body_path: notes.md
          files: |
            dist/gitphin.fap
            dist/*.zip
            dist/*.tar.gz
            dist/catalog-manifest.yml
            dist/SHA256SUMS
