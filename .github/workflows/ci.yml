name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly: catch firmware SDK changes that break the build
    - cron: "17 4 * * 1"

jobs:
  app:
    name: "App (uFBT, ${{ matrix.sdk }} firmware)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [release, dev]
    steps:
      - uses: actions/checkout@v4
      - name: Web page and its gzip match
        run: |
          cmp <(gzip -dc flipper_app/files/index.html.gz) flipper_app/files/index.html || { echo "::error::Run pc/tools/build_page.sh and commit flipper_app/files/index.html.gz"; exit 1; }
          out=$(mktemp -d)
          sh pc/tools/build_page.sh "$out"
          cmp "$out/index.html" flipper_app/files/index.html || { echo "::error::flipper_app/files/index.html is not built from flipper_app/web. Run pc/tools/build_page.sh and commit"; exit 1; }
          cmp <(gzip -dc "$out/index.html.gz") <(gzip -dc flipper_app/files/index.html.gz) || { echo "::error::flipper_app/files/index.html.gz is out of date. Run pc/tools/build_page.sh and commit"; exit 1; }
      - name: Build with uFBT
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build
        with:
          app-dir: flipper_app
          sdk-channel: ${{ matrix.sdk }}
      - name: Every core function a plugin imports is in the API table
        run: |
          command -v arm-none-eabi-nm >/dev/null || ls ~/.ufbt/toolchain/*/bin/arm-none-eabi-nm >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq binutils-arm-none-eabi; }
          pc/tools/check_plugin_api.sh
      - name: The .fap carries the plugins and the page
        run: |
          fap=$(find flipper_app/dist -name gitphin.fap | head -1)
          ls -l "$fap"
          for f in hub_pl_dav.fal hub_pl_pack.fal hub_pl_write.fal hub_pl_query.fal hub_pl_doc.fal index.html.gz; do
              grep -q "$f" "$fap" || { echo "::error::$f is not embedded in gitphin.fap"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gitphin-${{ matrix.sdk }}-${{ steps.build.outputs.suffix }}
          path: flipper_app/dist/*.fap
      - name: Lint (clang-format, as the Apps Catalog checks; fix with ufbt format)
        if: matrix.sdk == 'release'
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          app-dir: flipper_app
          skip-setup: true
          task: lint

  host-tests:
    name: Host tests (app code on the PC against git, ASan)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev
      - name: Logic (diff, compare, commit, merge)
        run: pc/tests/run_logic_test.sh
      - name: Routes (HTTP answers of every browse route)
        run: pc/tests/run_route_test.sh
      - name: Search
        run: pc/tests/run_search_test.sh
      - name: Commit graph
        run: pc/tests/run_graph_test.sh
      - name: Web writes
        run: pc/tests/run_write_test.sh
      - name: Packing
        run: pc/tests/run_gitpack_test.sh
      - name: Object reader
        run: pc/tests/run_gitobj_test.sh
      - name: git helper against the mock server
        run: pc/tests/test_git_flipper.sh

  pc:
    name: PC bridge and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python compiles
        run: python3 -m py_compile pc/bridge.py pc/gitphin_bridge/*.py pc/gitphin_git/*.py pc/git-remote-flipper pc/tests/mock_hub.py pc/tests/webhook_sink.py pc/tests/zip_compare.py pc/tests/logic_check.py pc/tests/logic/*.py tools/screenshots/demo_server.py
      - name: Shell syntax
        run: for f in install.sh pc/*.sh pc/tools/*.sh pc/tests/*.sh tools/screenshots/*.sh; do bash -n "$f"; done
      - name: PC bridge (ZIP, webhooks, backup, push to both) against the mock
        run: pc/tests/test_bridge.sh
      - name: Web page (bundle, JS, highlighter, browser check)
        run: CHROMIUM=$(command -v google-chrome || command -v chromium) pc/tests/test_page.sh
      - name: No source file over 500 lines
        run: |
          big=$(find flipper_app/src flipper_app/web pc tools -type f \( -name '*.c' -o -name '*.h' -o -name '*.py' -o -name '*.js' -o -name '*.cjs' -o -name '*.css' -o -name '*.sh' \) -exec wc -l {} + | awk '$2 != "total" && $1 > 500')
          [ -z "$big" ] || { echo "::error::files over 500 lines:"; echo "$big"; exit 1; }
      - name: Version and changelogs agree
        run: |
          v=$(sed -n 's/^ *fap_version="\([0-9.]*\)".*/\1/p' flipper_app/application.fam)
          grep -q "^## $v\$" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $v' section"; exit 1; }
          grep -q "^v$v:\$" flipper_app/docs/changelog.md || { echo "::error::flipper_app/docs/changelog.md has no 'v$v:' entry"; exit 1; }
          echo "version $v"
