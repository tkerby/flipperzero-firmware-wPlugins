<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How AI Composer works: teacher, training, shrinking, Flipper</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff8200"/>
    </marker>
  </defs>
  <rect width="1000" height="330" rx="20" fill="#111113"/>

  <!-- 1 Teacher -->
  <rect x="30" y="60" width="205" height="190" rx="16" fill="#26262a"/>
  <circle cx="58" cy="88" r="14" fill="#ff8200"/>
  <text x="58" y="93" text-anchor="middle" font-size="14" font-weight="800" fill="#111113">1</text>
  <g fill="#f5f5f7">
    <rect x="96" y="112" width="2" height="34"/><ellipse cx="91" cy="147" rx="8" ry="6"/>
    <rect x="126" y="104" width="2" height="34"/><ellipse cx="121" cy="139" rx="8" ry="6"/>
    <rect x="96" y="104" width="32" height="5"/>
    <rect x="156" y="98" width="2" height="34"/><ellipse cx="151" cy="133" rx="8" ry="6"/>
    <path d="M158 98 q10 6 6 16 q-2 -8 -6 -9 z"/>
  </g>
  <text x="132" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#f5f5f7">Music teacher</text>
  <text x="132" y="212" text-anchor="middle" font-size="13" fill="#a0a0a8">Rules write 64,000</text>
  <text x="132" y="230" text-anchor="middle" font-size="13" fill="#a0a0a8">melodies in 8 styles</text>

  <line x1="241" y1="155" x2="273" y2="155" stroke="#ff8200" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 2 Training -->
  <rect x="280" y="60" width="205" height="190" rx="16" fill="#26262a"/>
  <circle cx="308" cy="88" r="14" fill="#ff8200"/>
  <text x="308" y="93" text-anchor="middle" font-size="14" font-weight="800" fill="#111113">2</text>
  <g stroke="#3a3a40" stroke-width="2">
    <line x1="345" y1="105" x2="383" y2="98"/><line x1="345" y1="105" x2="383" y2="122"/><line x1="345" y1="105" x2="383" y2="146"/>
    <line x1="345" y1="135" x2="383" y2="98"/><line x1="345" y1="135" x2="383" y2="122"/><line x1="345" y1="135" x2="383" y2="146"/>
    <line x1="383" y1="98" x2="421" y2="120"/><line x1="383" y1="122" x2="421" y2="120"/><line x1="383" y1="146" x2="421" y2="120"/>
  </g>
  <g fill="#f5f5f7"><circle cx="345" cy="105" r="7"/><circle cx="345" cy="135" r="7"/></g>
  <g fill="#ff8c28"><circle cx="383" cy="98" r="7"/><circle cx="383" cy="122" r="7"/><circle cx="383" cy="146" r="7"/></g>
  <circle cx="421" cy="120" r="7" fill="#f5f5f7"/>
  <text x="382" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#f5f5f7">Neural network</text>
  <text x="382" y="212" text-anchor="middle" font-size="13" fill="#a0a0a8">GRU learns the styles:</text>
  <text x="382" y="230" text-anchor="middle" font-size="13" fill="#a0a0a8">32,834 parameters</text>

  <line x1="491" y1="155" x2="523" y2="155" stroke="#ff8200" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 3 Shrink -->
  <rect x="530" y="60" width="205" height="190" rx="16" fill="#26262a"/>
  <circle cx="558" cy="88" r="14" fill="#ff8200"/>
  <text x="558" y="93" text-anchor="middle" font-size="14" font-weight="800" fill="#111113">3</text>
  <rect x="578" y="104" width="54" height="46" rx="6" fill="none" stroke="#a0a0a8" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="605" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#a0a0a8">32-bit</text>
  <line x1="638" y1="127" x2="656" y2="127" stroke="#ff8200" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660" y="113" width="40" height="28" rx="5" fill="#ff8c28"/>
  <text x="680" y="132" text-anchor="middle" font-size="11" font-weight="800" fill="#140c06">8-bit</text>
  <text x="632" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#f5f5f7">Shrunk to fit</text>
  <text x="632" y="212" text-anchor="middle" font-size="13" fill="#a0a0a8">int8 weights,</text>
  <text x="632" y="230" text-anchor="middle" font-size="13" fill="#a0a0a8">36.8 KB in total</text>

  <line x1="741" y1="155" x2="773" y2="155" stroke="#ff8200" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 4 Flipper -->
  <rect x="780" y="60" width="190" height="190" rx="16" fill="#26262a"/>
  <circle cx="808" cy="88" r="14" fill="#ff8200"/>
  <text x="808" y="93" text-anchor="middle" font-size="14" font-weight="800" fill="#111113">4</text>
  <rect x="822" y="100" width="106" height="54" rx="6" fill="#ff8c28"/>
  <g fill="#140c06">
    <rect x="830" y="132" width="8" height="3"/><rect x="842" y="126" width="6" height="3"/><rect x="852" y="120" width="10" height="3"/>
    <rect x="866" y="124" width="6" height="3"/><rect x="876" y="116" width="12" height="3"/><rect x="892" y="128" width="8" height="3"/>
    <rect x="904" y="138" width="14" height="3"/><rect x="870" y="106" width="2" height="42"/>
  </g>
  <text x="875" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#f5f5f7">Flipper Zero</text>
  <text x="875" y="212" text-anchor="middle" font-size="13" fill="#a0a0a8">Writes and plays new</text>
  <text x="875" y="230" text-anchor="middle" font-size="13" fill="#a0a0a8">melodies, offline</text>

  <text x="500" y="292" text-anchor="middle" font-size="13" fill="#a0a0a8">Steps 1-3 run once on a computer. Step 4 is the app: every melody is new, no internet and no samples.</text>
</svg>
