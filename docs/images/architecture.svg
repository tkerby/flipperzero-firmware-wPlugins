<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How Subscriber Counter gets its data</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff8200"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="20" fill="#111113"/>

  <!-- Flipper -->
  <rect x="40" y="70" width="240" height="150" rx="16" fill="#26262a"/>
  <rect x="64" y="94" width="112" height="58" rx="6" fill="#ff8c28"/>
  <text x="120" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#140c06">Pixel Workshop</text>
  <text x="120" y="141" text-anchor="middle" font-size="22" font-weight="800" fill="#140c06">948</text>
  <circle cx="232" cy="123" r="22" fill="#1a1a1d" stroke="#3a3a40" stroke-width="2"/>
  <circle cx="232" cy="123" r="8" fill="#3a3a40"/>
  <text x="160" y="186" text-anchor="middle" font-size="17" font-weight="700" fill="#f5f5f7">Flipper Zero</text>
  <text x="160" y="207" text-anchor="middle" font-size="13" fill="#a0a0a8">Subscriber Counter app</text>

  <!-- Link 1 -->
  <line x1="296" y1="145" x2="364" y2="145" stroke="#ff8200" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="330" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f7">USB or</text>
  <text x="330" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f7">Bluetooth</text>

  <!-- Computer -->
  <rect x="380" y="70" width="240" height="150" rx="16" fill="#26262a"/>
  <rect x="440" y="92" width="120" height="70" rx="6" fill="#3a3a40"/>
  <rect x="450" y="102" width="100" height="50" rx="3" fill="#1a1a1d"/>
  <text x="500" y="133" text-anchor="middle" font-size="12" font-weight="600" fill="#ff8c28">bridge</text>
  <rect x="485" y="162" width="30" height="6" fill="#3a3a40"/>
  <text x="500" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#f5f5f7">Your computer</text>
  <text x="500" y="211" text-anchor="middle" font-size="13" fill="#a0a0a8">Flipper Internet Bridge helper</text>

  <!-- Link 2 -->
  <line x1="636" y1="145" x2="704" y2="145" stroke="#ff8200" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="670" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f7">HTTPS</text>
  <text x="670" y="170" text-anchor="middle" font-size="13" fill="#a0a0a8">GET</text>

  <!-- API -->
  <rect x="720" y="70" width="200" height="150" rx="16" fill="#26262a"/>
  <text x="820" y="118" text-anchor="middle" font-size="30" font-weight="800" fill="#f5f5f7">{ }</text>
  <text x="820" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#f5f5f7">YouTube Data</text>
  <text x="820" y="191" text-anchor="middle" font-size="17" font-weight="700" fill="#f5f5f7">API v3</text>
  <text x="820" y="211" text-anchor="middle" font-size="13" fill="#a0a0a8">channels.list</text>

  <text x="480" y="258" text-anchor="middle" font-size="13" fill="#a0a0a8">Every few minutes the app asks the YouTube Data API for the channel's statistics.</text>
  <text x="480" y="278" text-anchor="middle" font-size="13" fill="#a0a0a8">The desktop helper only forwards that one HTTPS request.</text>
</svg>
