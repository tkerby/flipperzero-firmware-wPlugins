# Source-assertion -> question mapping (SPEC 4.1 step 3).
#
# Each source normalises an assertion to "predicate object" (lower case,
# underscores collapsed to spaces) and matches it against these regexes.
# `q` is the question id, `polarity` 1 means the match asserts yes, 0 asserts no.
# `p` overrides the probability the match contributes (default: from the source).

