# Nucleo trainers. Trainer id = position in this file (1-based; 0 = none / wild).
# ai: the trainer's AI class (assets/data/ai.toml, contract 82): its move-choice modifiers (1: no second status on a creature that has one, 2: set-up moves on the second turn,
#     3: super effective moves) and its item / switch routine (salves, boost items, Cure-All ...). The old `ai_mod = [..]` list of this file is gone: the class says it.
# party = [[species, level], ...] (<= 6). When counter_starter = true, party slot 0's species is
# replaced at runtime by counter[<player's starter species>] (rival: picks the starter that
# beats yours). name = the trainer's class + personal name shown in the battle ("Explorador Teo"): a global text key
# "gl.tr.<id>" (assets/text/<lang>.txt, <= 15 glyphs), or "rival" = the runtime {rival} name the player chose.
# money = base money.

[rival_lab]
name = "rival"
ai = "basic"
money = 35
counter_starter = true
party = [["embercub", 5]]
counter = { sprouton = "embercub", embercub = "puddlet", puddlet = "sprouton" }

